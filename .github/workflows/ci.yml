name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and unit tests
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@12.17.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      # Bounded on purpose: a test command that hangs (apps/desktop did, printing nothing at all) used to sit here until the
      # job's own 45-minute cap, which looks like "the tests are slow" instead of "something never exited".
      - name: Unit tests
        timeout-minutes: 20
        env:
          TMPDIR: ${{ runner.temp }}
        run: pnpm -r test
      - name: README feature table matches the live-test results (docs/live-results.json)
        run: node scripts/feature-table.mjs --check
