name: Release

# Every push to main builds the artifacts and publishes them as a GitHub release (version 0.1.<run number>).
on:
  push:
    branches: [main]
  workflow_dispatch:   # only does something on main (see the job guards)

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 0.1.${{ github.run_number }}
  # injected into every build: the UI (Vite define), the desktop package.json version (electron-builder), the Android versionName and the Android backend bundle
  UNICHAT_VERSION: 0.1.${{ github.run_number }}

jobs:
  web:
    if: github.ref == 'refs/heads/main'
    name: Web UI and server bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@12.17.0
      - run: pnpm install --frozen-lockfile
      - name: Build the web UI
        run: pnpm --filter @unimsg/ui build
      - name: Package
        run: |
          mkdir -p artifacts
          tar -czf artifacts/unichat-web-ui-${VERSION}.tar.gz -C apps/ui/dist .
          # the backend as a self-contained source bundle (run with: pnpm install && pnpm --filter @unimsg/server dev)
          git archive --format=tar.gz --prefix=unichat-${VERSION}/ -o artifacts/unichat-source-${VERSION}.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: artifacts/*

  demo:
    if: github.ref == 'refs/heads/main'
    name: Demo on GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The mock UI (apps/ui/src/mock.ts) published at https://pixelcrafterexe.github.io/unichat/ : no backend, no real data.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@12.17.0
      - run: pnpm install --frozen-lockfile
      - name: Build the demo
        run: node scripts/build-demo.mjs
      - name: Publish it to the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/ui/dist-demo
          git init -q -b gh-pages
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -q -m "UniChat demo ${VERSION} (mock data, no backend)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  desktop:
    if: github.ref == 'refs/heads/main'
    name: Desktop app (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@12.17.0
      - run: pnpm install --frozen-lockfile
      - name: Build the web UI (bundled into the app)
        run: pnpm --filter @unimsg/ui build
      - name: Tools for the pacman package (fpm needs zstd and bsdtar)
        run: sudo apt-get update && sudo apt-get install -y zstd libarchive-tools
      - name: Package the desktop app (version = UNICHAT_VERSION)
        run: pnpm --filter @unimsg/desktop dist:linux
      - name: Collect
        run: |
          mkdir -p artifacts
          cp apps/desktop/dist/*.AppImage artifacts/ 2>/dev/null || true
          cp apps/desktop/dist/*.deb artifacts/ 2>/dev/null || true
          cp apps/desktop/dist/*.pkg.tar.zst artifacts/ 2>/dev/null || true
          ls -la artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: artifacts/*
          if-no-files-found: warn

  android:
    if: github.ref == 'refs/heads/main'
    name: Android app (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The Android build cross-compiles libsignal (Rust) and fetches nodejs-mobile: long, and best effort in CI for now.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Signing key, checked FIRST so a missing secret fails in seconds, not after the long build (must be the key of the installed app, or Android refuses the update)
        env:
          KS_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Repository secret ANDROID_DEBUG_KEYSTORE_B64 is missing (base64 of the developer's ~/.android/debug.keystore). Without it the APK is signed with a random key and installed apps cannot update to it."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore
          # Named explicitly for Gradle (app/build.gradle, signingConfigs.debug): the Android plugin's own lookup did not
          # find this file on the runner and signed with a key it generated instead.
          echo "UNICHAT_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Which key the SECRET actually carries. A phone refuses an update signed by another key ("the package conflicts with an
      # existing app", issue #92) and that used to show up only on the phone, a release too late. Set the repository variable
      # ANDROID_DEBUG_KEY_SHA256 to the fingerprint of the developer's key (keytool -list -v -keystore ~/.android/debug.keystore
      # -storepass android, without the colons) and a wrong secret stops the build here instead.
      - name: The signing key is the expected one
        env:
          WANT: ${{ vars.ANDROID_DEBUG_KEY_SHA256 }}
        run: |
          GOT=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "secret keystore SHA-256: $GOT"
          if [ -n "$WANT" ] && [ "$GOT" != "$(echo "$WANT" | tr -d ':' | tr 'A-Z' 'a-z')" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_B64 holds the key $GOT, but ANDROID_DEBUG_KEY_SHA256 says the APK must be signed with $WANT. An APK signed with this key cannot update an installed app. Re-upload the keystore: base64 -w0 ~/.android/debug.keystore | gh secret set ANDROID_DEBUG_KEYSTORE_B64"
            exit 1
          fi
      # the ubuntu runner image already carries the Android SDK (ANDROID_HOME) and sdkmanager; the setup action failed on it
      - name: Android SDK / NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake clang patchelf unzip
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android
      - run: npm install -g pnpm@12.17.0
      - run: pnpm install --frozen-lockfile
      - name: nodejs-mobile
        working-directory: apps/android
        run: node scripts/fetch-nodejs-mobile.mjs
      - name: libsignal for Android (Rust cross build)
        working-directory: apps/android
        run: bash scripts/build-libsignal-android.sh
      - name: HyperDHT native add-ons for Android
        working-directory: apps/android
        run: bash scripts/build-hyperdht-android.sh
      - name: Android version code
        # versionCode must keep growing and stay above any local dev build (package.json 0.1.0 -> 100; a few were built by
        # hand with codes up to 1032, which the old 1000+run base fell below -- Android refuses an update to a lower code)
        run: echo "UNICHAT_VERSION_CODE=$((2000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build the app
        working-directory: apps/android
        run: pnpm run debug
      - name: The APK is signed with the expected key
        # An APK signed with a different key than the installed app cannot update it (issue #92). This step only PRINTED
        # the fingerprint, so an APK signed with a key the Android plugin had generated itself was published anyway --
        # while the check of the secret, above, passed. The APK itself is what has to carry the key.
        env:
          WANT: ${{ vars.ANDROID_DEBUG_KEY_SHA256 }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs apps/android/android/app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          echo "APK signing certificate SHA-256: $GOT"
          [ -n "$GOT" ] || { echo "::error::Could not read the APK's signing certificate."; exit 1; }
          if [ -n "$WANT" ] && [ "$GOT" != "$(echo "$WANT" | tr -d ':' | tr 'A-Z' 'a-z')" ]; then
            echo "::error::The APK is signed with $GOT, not the developer's key $WANT: it could not update the installed app, so it is not published."
            exit 1
          fi
      - name: Collect
        run: |
          mkdir -p artifacts
          cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk artifacts/unichat-android-${VERSION}-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*
          if-no-files-found: warn

  flatpak:
    if: github.ref == 'refs/heads/main'
    name: Desktop app (Flatpak)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Best effort until the first successful run: the release does not wait for / depend on it.
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
      # The runtimes ship inside the image, so they sit in a LOWER overlayfs layer. flatpak updates a runtime by renaming directories out
      # of that layer, which returns EXDEV ("Invalid cross-device link") on runners whose overlayfs has redirect_dir off -- then
      # flatpak-builder dies and xvfb-run reports the segfault (exit 139). Docker fills this volume from the image on first mount, so the
      # installation lands on a real filesystem where those renames work. See flatpak/flatpak-github-actions#267.
      volumes:
        - flatpak-installation:/var/lib/flatpak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@12.17.0
      - run: pnpm install --frozen-lockfile
      - name: Build the web UI (bundled into the app)
        run: pnpm --filter @unimsg/ui build
      - name: "Unpacked Linux app (apps/desktop/dist/linux-unpacked)"
        run: pnpm --filter @unimsg/desktop exec electron-vite build && pnpm --filter @unimsg/desktop exec electron-builder --dir -c.extraMetadata.version=${UNICHAT_VERSION}
      - name: Free disk space (the flatpak build ran out of it), only dist/linux-unpacked is needed from here on
        run: |
          rm -rf node_modules apps/*/node_modules packages/*/node_modules ~/.local/share/pnpm ~/.cache/pnpm ~/.cache/electron ~/.cache/electron-builder apps/desktop/out apps/ui/dist
          df -h / | tail -1
      # ostree hardlinks what it staged in TMPDIR into the installation, so the staging area has to be on the same filesystem as
      # /var/lib/flatpak (the volume above), not on the container's overlay. The listing shows which runtimes the image brought.
      - name: Stage flatpak downloads on the same filesystem as the flatpak installation
        run: |
          mkdir -p /var/lib/flatpak/ci-tmp
          echo "TMPDIR=/var/lib/flatpak/ci-tmp" >> "$GITHUB_ENV"
          df -h /var/lib/flatpak /tmp | tail -2
          flatpak --system list --columns=ref,branch,origin || true
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: unichat-desktop-${{ env.VERSION }}.flatpak
          manifest-path: apps/desktop/flatpak/org.unichat.desktop.yml
          cache: false   # the builder cache of the whole app is hundreds of MB and filled the runner disk
          cache-key: flatpak-builder-${{ github.sha }}
          arch: x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: unichat-desktop-${{ env.VERSION }}.flatpak
          if-no-files-found: warn

  publish:
    name: Publish release
    needs: [web, desktop, android, flatpak]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: "Release manifest (latest.json, read by the apps' updater: version, notes, name/size/sha256 per platform)"
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: node scripts/release-manifest.mjs artifacts "${VERSION}" "${HEAD_MSG:-UniChat ${VERSION}}"
      - name: PKGBUILD for Arch (AUR-style unichat-bin, pins the sha256 of the pacman package)
        run: node scripts/arch-pkgbuild.mjs artifacts "${VERSION}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "v${VERSION}" artifacts/* \
            --target "${GITHUB_SHA}" \
            --title "UniChat ${VERSION}" \
            --generate-notes \
            --latest
